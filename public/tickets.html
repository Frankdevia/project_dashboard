<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tickets FreeScout</title>
<script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #10151C;
    --bg-card: #171E27;
    --bg-card-hover: #1D2630;
    --bg-input: #0B0F14;
    --border: rgba(150,180,210,0.12);
    --border-focus: rgba(150,180,210,0.30);
    --text: #E7EDF3;
    --text-muted: #93A1B0;
    --text-dim: #586676;
    --accent: #5BC6BE;
    --accent-ink: #06201E;
    --red: #F0524D;
    --amber: #E0A030;
    --blue: #5BC6BE;
    --green: #3BA776;
    --prio-alta: #F0524D;
    --prio-media: #E0A030;
    --prio-baja: #3BA776;
    --radius: 14px;
    --radius-sm: 9px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --track: rgba(255,255,255,0.07);
    --tint: rgba(255,255,255,0.03);
    --prio-alta-bg: rgba(240,82,77,0.14);
    --prio-media-bg: rgba(224,160,48,0.14);
    --prio-baja-bg: rgba(59,167,118,0.14);
    --st-done: #3BA776; --st-done-bg: rgba(59,167,118,0.14);
    --st-adv:  #5BC6BE; --st-adv-bg:  rgba(91,198,190,0.14);
    --st-prog: #93A1B0; --st-prog-bg: rgba(147,161,176,0.12);
    --st-init: #6B7686; --st-init-bg: rgba(120,135,155,0.10);
  }
  :root[data-theme="light"] {
    --bg: #EEF1F4;
    --bg-card: #FFFFFF;
    --bg-card-hover: #F4F7FA;
    --bg-input: #FFFFFF;
    --border: rgba(20,45,70,0.13);
    --border-focus: rgba(20,45,70,0.32);
    --text: #16222E;
    --text-muted: #52626F;
    --text-dim: #8593A0;
    --accent: #128C84;
    --accent-ink: #FFFFFF;
    --red: #D23A34;
    --amber: #9C6B0E;
    --blue: #128C84;
    --green: #1C8A5B;
    --track: rgba(20,45,70,0.10);
    --tint: rgba(20,45,70,0.035);
    --prio-alta: #D23A34;  --prio-alta-bg: rgba(210,58,52,0.12);
    --prio-media: #9C6B0E; --prio-media-bg: rgba(156,107,14,0.13);
    --prio-baja: #1C8A5B;  --prio-baja-bg: rgba(28,138,91,0.13);
    --st-done: #1C8A5B; --st-done-bg: rgba(28,138,91,0.13);
    --st-adv:  #128C84; --st-adv-bg:  rgba(18,140,132,0.13);
    --st-prog: #52626F; --st-prog-bg: rgba(82,98,111,0.12);
    --st-init: #8593A0; --st-init-bg: rgba(133,147,160,0.12);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 0;
  }

  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
  }

  .header { padding: 2.5rem 2rem 1.5rem; max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
  .header-left { flex: 1; }
  .header-left h1 { font-family: var(--font-display); font-weight: 700; font-size: 2rem; letter-spacing: -0.03em; color: var(--text); }
  .header-left h1 span { color: var(--text-dim); font-weight: 300; }
  .header-left p { color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem; }
  .nav-links { display: flex; gap: 10px; flex-wrap: wrap; }
  .nav-links a { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.6rem 1.2rem; color: var(--text); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
  .nav-links a svg { opacity: 0.7; transition: opacity 0.2s; }
  .nav-links a:hover { background: var(--bg-card-hover); border-color: var(--border-focus); }
  .nav-links a:hover svg { opacity: 1; }
  .nav-links a.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .nav-links a.active svg { opacity: 1; }

  .nav-btn { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.6rem 1.2rem; color: var(--text); font-family: var(--font-body); font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; }
  .nav-btn svg { opacity: 0.7; transition: opacity 0.2s; }
  .nav-btn:hover { background: var(--bg-card-hover); border-color: var(--border-focus); }
  .nav-btn:hover svg { opacity: 1; }
  /* Theme toggle — fixed circular icon in the top-right corner */
  #btnTheme { position: fixed; top: 1rem; right: 1rem; z-index: 1500; width: 42px; height: 42px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--bg-card); border: 1px solid var(--border); box-shadow: 0 2px 12px rgba(0,0,0,0.28); transition: background 0.2s, border-color 0.2s, transform 0.15s; }
  #btnTheme:hover { background: var(--bg-card-hover); border-color: var(--border-focus); transform: translateY(-1px); }
  #btnTheme:active { transform: scale(0.94); }
  #btnTheme svg { opacity: 0.9; transition: transform 0.4s ease, opacity 0.2s; }
  #btnTheme:hover svg { opacity: 1; transform: rotate(40deg); }
  .nav-links { padding-right: 3.5rem; }
  @media (max-width: 600px) { #btnTheme { top: 0.75rem; right: 0.75rem; width: 38px; height: 38px; } .header { padding-right: 3.25rem; } }
  /* ===== Tickets page ===== */
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 2rem 3rem; display: flex; flex-direction: column; gap: 1rem; }
  .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.3rem 1.5rem; }
  .eyebrow { font-family: var(--font-mono); font-size: 0.68rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.18em; color: var(--text-dim); }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .panel-head .hint { font-size: 0.74rem; color: var(--text-muted); }
  .section-title { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; color: var(--text); margin: 0.6rem 0 -0.2rem; display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
  .section-title small { font-family: var(--font-body); font-weight: 400; font-size: 0.78rem; color: var(--text-muted); }

  /* Range picker */
  .range { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; padding: 0.9rem 1.1rem; }
  .presets { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .preset { background: var(--tint); border: 1px solid var(--border); border-radius: 999px; color: var(--text-muted); font-family: var(--font-body); font-size: 0.78rem; padding: 0.35rem 0.8rem; cursor: pointer; transition: all 0.15s; }
  .preset:hover { color: var(--text); border-color: var(--border-focus); }
  .preset.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .range-sep { flex: 1; }
  .range label { font-size: 0.74rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.4rem; }
  .range input[type=date] { background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: var(--font-mono); font-size: 0.8rem; padding: 0.35rem 0.5rem; color-scheme: dark; }
  :root[data-theme="light"] .range input[type=date] { color-scheme: light; }
  .btn-apply { background: var(--accent); border: 1px solid var(--accent); border-radius: var(--radius-sm); color: var(--accent-ink); font-family: var(--font-body); font-size: 0.8rem; font-weight: 600; padding: 0.4rem 0.95rem; cursor: pointer; }
  .range-msg { font-size: 0.72rem; color: var(--amber); width: 100%; display: none; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.85rem; }
  .kpi { background: var(--bg-card); border: 1px solid var(--border); border-left: 3px solid var(--rail, var(--text-dim)); border-radius: var(--radius); padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 0.3rem; }
  .kpi-val { font-family: var(--font-display); font-weight: 700; font-size: 2.1rem; letter-spacing: -0.03em; line-height: 1; color: var(--text); font-variant-numeric: tabular-nums; }
  .kpi-val .u { font-size: 1rem; font-weight: 500; color: var(--text-muted); margin-left: 0.15rem; }
  .kpi-sub { font-size: 0.74rem; color: var(--text-muted); }
  .delta { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-dim); }
  .delta.good { color: var(--green); }
  .delta.bad { color: var(--red); }

  .grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 1rem; }

  /* Per-agent time bars */
  .tbars { display: grid; grid-template-columns: minmax(140px, 190px) 1fr 1fr; gap: 0.55rem 1rem; align-items: center; }
  .tbars .h { font-family: var(--font-mono); font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); padding-bottom: 0.2rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.4rem; }
  .tbars .h i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .tbar { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
  .tbar-track { flex: 1; height: 16px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .tbar-fill { height: 100%; border-radius: 4px; transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
  .tbar-val { width: 58px; text-align: right; font-family: var(--font-mono); font-size: 0.78rem; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .tbar-val.na { color: var(--text-dim); font-weight: 400; }

  .age-row { display: grid; grid-template-columns: 78px 1fr 34px; align-items: center; gap: 0.7rem; margin-bottom: 0.6rem; }
  .age-label { font-size: 0.78rem; color: var(--text-muted); text-align: right; font-family: var(--font-mono); }
  .age-track { height: 22px; background: var(--track); border-radius: 6px; overflow: hidden; }
  .age-fill { height: 100%; border-radius: 6px; transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
  .age-count { font-family: var(--font-mono); font-weight: 600; font-size: 0.85rem; color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
  .age-foot { margin-top: 0.8rem; font-size: 0.74rem; color: var(--text-muted); }

  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  th { text-align: left; font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); padding: 0 0.6rem 0.6rem; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 0.6rem; border-bottom: 1px solid var(--border); color: var(--text); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  th.num, td.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  td.num.zero { color: var(--text-dim); }
  .who { display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
  .who-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.84rem; color: var(--text); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 0.7rem; color: var(--accent); background: var(--tint); border: 1px solid var(--border); overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .notes { font-size: 0.72rem; color: var(--text-dim); line-height: 1.6; }
  .notes .warn { color: var(--amber); }
  .state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; }
  .state code { font-family: var(--font-mono); background: var(--tint); border: 1px solid var(--border); border-radius: 6px; padding: 0.1rem 0.4rem; color: var(--text); }
  .stale { color: var(--amber); }
  .refresh-btn { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-muted); font-family: var(--font-body); font-size: 0.78rem; padding: 0.35rem 0.8rem; cursor: pointer; }
  .refresh-btn:hover { color: var(--text); border-color: var(--border-focus); }
  .loading { opacity: 0.55; pointer-events: none; transition: opacity 0.2s; }

  /* Chart series colours (validated for CVD/contrast against each theme's card surface) */
  :root { --c-new: #14A89D; --c-closed: #C7831A; }
  :root[data-theme="light"] { --c-new: #0B8F86; --c-closed: #A86F0A; }

  /* Satisfaction stacked bars */
  .csat-row { display: grid; grid-template-columns: minmax(130px, 180px) 1fr 54px; gap: 0.8rem; align-items: center; margin-bottom: 0.65rem; }
  .stack { display: flex; height: 18px; border-radius: 4px; overflow: hidden; background: var(--track); gap: 2px; }
  .stack span { height: 100%; }
  .stack-empty { font-size: 0.72rem; color: var(--text-dim); }
  .csat-val { text-align: right; font-family: var(--font-mono); font-size: 0.8rem; font-weight: 600; color: var(--text); }
  .legend { display: flex; gap: 0.9rem; flex-wrap: wrap; font-size: 0.72rem; color: var(--text-muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 0.35rem; vertical-align: -1px; }

  /* Status pills (text + colour, never colour alone) */
  .pill { display: inline-block; font-family: var(--font-mono); font-size: 0.7rem; font-weight: 600; padding: 0.12rem 0.45rem; border-radius: 999px; }
  .pill.good { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
  .pill.warn { color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, transparent); }
  .pill.bad { color: var(--red); background: color-mix(in srgb, var(--red) 14%, transparent); }

  /* Alarm lists */
  .alist { list-style: none; display: flex; flex-direction: column; gap: 0.45rem; }
  .alist li { display: grid; grid-template-columns: 52px 1fr auto; gap: 0.6rem; align-items: baseline; font-size: 0.8rem; padding: 0.45rem 0.6rem; background: var(--tint); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .alist .n { font-family: var(--font-mono); color: var(--text-muted); }
  .alist .s { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .alist .s small { display: block; color: var(--text-muted); font-size: 0.7rem; }
  .alist .w { font-family: var(--font-mono); font-weight: 600; color: var(--text); white-space: nowrap; }
  .alist-title { font-size: 0.74rem; color: var(--text-muted); margin: 0.9rem 0 0.45rem; }
  .alist-title:first-child { margin-top: 0; }
  .empty-note { font-size: 0.78rem; color: var(--text-dim); padding: 0.4rem 0; }

  /* Trend charts */
  .chart-scroll { overflow-x: auto; }
  .chart-scroll svg { display: block; min-width: 560px; width: 100%; height: auto; }
  .chart-scroll text { font-family: var(--font-mono); font-size: 10px; fill: var(--text-muted); }
  .chart-scroll .grid-line { stroke: var(--border); stroke-width: 1; }
  .chart-scroll .hit { fill: transparent; cursor: default; }
  .chart-scroll .hit:hover { fill: var(--tint); }

  /* Heatmap */
  .heat { display: grid; gap: 3px; min-width: 420px; }
  .heat .hl { font-family: var(--font-mono); font-size: 0.66rem; color: var(--text-muted); display: flex; align-items: center; }
  .heat .hh { font-family: var(--font-mono); font-size: 0.6rem; color: var(--text-dim); text-align: center; }
  .heat .c { height: 22px; border-radius: 3px; }
  .heat-legend { display: flex; align-items: center; gap: 4px; font-size: 0.68rem; color: var(--text-muted); margin-top: 0.7rem; }
  .heat-legend span.c { width: 16px; height: 12px; border-radius: 2px; display: inline-block; }

  /* Hover tooltip */
  #tip { position: fixed; z-index: 3000; pointer-events: none; background: var(--bg-card); border: 1px solid var(--border-focus); border-radius: var(--radius-sm); padding: 0.5rem 0.65rem; font-size: 0.76rem; color: var(--text); box-shadow: 0 6px 20px rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.1s; max-width: 260px; line-height: 1.5; }
  #tip b { font-family: var(--font-display); }
  #tip .row { display: flex; justify-content: space-between; gap: 1rem; }
  #tip .row span:last-child { font-family: var(--font-mono); font-weight: 600; }

  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
  @media (max-width: 1100px) { .grid2.trend2 { grid-template-columns: 1fr; } }
  @media (max-width: 600px) {
    .wrap { padding-left: 1rem; padding-right: 1rem; }
    .header { padding-left: 1rem; }
    .kpi-val { font-size: 1.7rem; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .tbars { grid-template-columns: 1fr; gap: 0.3rem; }
    .tbars .h.hname { display: none; }
    .tbars .who { margin-top: 0.6rem; }
    .range-sep { display: none; }
  }
</style>
<script src="/auth-guard.js"></script>
</head>

    <a href="leader-dashboard.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
      Líder
    </a>
    <a href="tickets.html" class="active">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9a3 3 0 0 0 0 6v3a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-3a3 3 0 0 0 0-6V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"></path><line x1="13" y1="5" x2="13" y2="7"></line><line x1="13" y1="11" x2="13" y2="13"></line><line x1="13" y1="17" x2="13" y2="19"></line></svg>
      Tickets
    </a>
    <a href="my-dashboard.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"></path><path d="M7 15l4-4 3 3 5-6"></path></svg>
      My Dashboard
    </a>
    <a href="usuarios.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      Usuarios

  </div>
</div>

<div class="wrap">
  <div class="panel range" id="rangeBar">
    <div class="presets" id="presets">
      <button class="preset" data-p="7">7 días</button>
      <button class="preset" data-p="30">30 días</button>
      <button class="preset" data-p="90">90 días</button>
      <button class="preset" data-p="mes">Este mes</button>
      <button class="preset" data-p="mesant">Mes anterior</button>
    </div>
    <span class="range-sep"></span>
    <label>Desde <input type="date" id="fDesde"></label>
    <label>Hasta <input type="date" id="fHasta"></label>
    <button class="btn-apply" id="btnApply">Aplicar</button>
    <div class="range-msg" id="rangeMsg"></div>
  </div>
  <div id="root" style="display:flex;flex-direction:column;gap:1rem;"><div class="panel state">Consultando FreeScout…</div></div>
</div>

<script>
let leaders = [];
const MAX_DAYS = 92;

function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function normName(s) {
  return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\bbryan\b/g, 'brian').trim();
}
function leaderFor(name) { const n = normName(name); return leaders.find(l => normName(l.name) === n); }
function initials(name) { return (name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?'; }
function avatar(name) {
  const l = leaderFor(name);
  return `<span class="avatar">${l && l.photo ? `<img src="${esc(l.photo)}" alt="">` : esc(initials(name))}</span>`;
}

// ── Formatting ──
function fmtMin(m) {
  if (m == null) return '—';
  if (m < 60) return `${Math.round(m)} min`;
  const h = m / 60;
  if (h < 48) return `${h.toFixed(1).replace('.0', '')} h`;
  return `${(h / 24).toFixed(1).replace('.0', '')} d`;
}
function fmtHours(h) { return h == null ? '—' : fmtMin(h * 60); }
// Big-number variant: value + unit separately
function bigDur(h) {
  if (h == null) return '—';
  const s = fmtHours(h); const i = s.lastIndexOf(' ');
  return `${esc(s.slice(0, i))}<span class="u">${esc(s.slice(i + 1))}</span>`;
}
function fmtNum(n) { return n == null ? '—' : Number(n).toLocaleString('es-CO'); }
function fmtDay(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('es-CO', { day: 'numeric', month: 'short', year: 'numeric' });
}
function delta(cur, prev, { lowerIsBetter = false, neutral = false } = {}) {
  if (cur == null || prev == null || prev === 0) return '<span class="delta">sin comparación</span>';
  const pct = ((cur - prev) / prev) * 100;
  if (Math.abs(pct) < 0.5) return '<span class="delta">= igual que el periodo anterior</span>';
  const up = pct > 0;
  const cls = neutral ? '' : ((up !== lowerIsBetter) ? 'good' : 'bad');
  return `<span class="delta ${cls}">${up ? '▲' : '▼'} ${Math.abs(pct).toFixed(0)}% vs periodo anterior</span>`;
}

// ── Date range ──
function isoLocal(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function addDays(iso, n) { const [y, m, d] = iso.split('-').map(Number); return isoLocal(new Date(y, m - 1, d + n)); }
function daysBetween(a, b) { const p = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((p(b) - p(a)) / 86400000); }
function presetRange(p) {
  const today = isoLocal(new Date());
  const yest = addDays(today, -1);
  if (p === 'mes') return { desde: today.slice(0, 8) + '01', hasta: today };
  if (p === 'mesant') {
    const first = today.slice(0, 8) + '01';
    const lastPrev = addDays(first, -1);
    return { desde: lastPrev.slice(0, 8) + '01', hasta: lastPrev };
  }
  const n = Number(p);
  return { desde: addDays(yest, -(n - 1)), hasta: yest };
}
function rangeFromUrl() {
  const q = new URLSearchParams(location.search);
  const ok = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
  if (ok(q.get('desde')) && ok(q.get('hasta'))) return { desde: q.get('desde'), hasta: q.get('hasta') };
  return presetRange('7');
}
let range = rangeFromUrl();

function syncRangeUi() {
  document.getElementById('fDesde').value = range.desde;
  document.getElementById('fHasta').value = range.hasta;
  document.querySelectorAll('.preset').forEach(b => {
    const r = presetRange(b.dataset.p);
    b.classList.toggle('on', r.desde === range.desde && r.hasta === range.hasta);
  });
}
function setRange(r) {
  const msg = document.getElementById('rangeMsg');
  msg.style.display = 'none';
  if (!r.desde || !r.hasta) return;
  if (r.desde > r.hasta) [r.desde, r.hasta] = [r.hasta, r.desde];
  if (daysBetween(r.desde, r.hasta) + 1 > MAX_DAYS) {
    r.desde = addDays(r.hasta, -(MAX_DAYS - 1));
    msg.textContent = `El rango máximo es ${MAX_DAYS} días; se ajustó la fecha inicial.`;
    msg.style.display = 'block';
  }
  range = { desde: r.desde, hasta: r.hasta };
  history.replaceState(null, '', `?desde=${range.desde}&hasta=${range.hasta}`);
  syncRangeUi();
  load();
}
document.getElementById('presets').addEventListener('click', e => {
  const b = e.target.closest('.preset'); if (b) setRange(presetRange(b.dataset.p));
});
document.getElementById('btnApply').addEventListener('click', () =>
  setRange({ desde: document.getElementById('fDesde').value, hasta: document.getElementById('fHasta').value }));

// ── Render ──
function render(data) {
  const root = document.getElementById('root');
  const sub = document.getElementById('subtitle');
  root.classList.remove('loading');

  if (!data.configured) {
    sub.textContent = 'Integración no configurada';
    root.innerHTML = `<div class="panel state">
      La integración con FreeScout no está configurada en el servidor.<br>
      Define <code>FREESCOUT_MCP_URL</code> en las variables de entorno.
    </div>`;
    return;
  }
  if (data.error) {
    sub.textContent = 'Error al consultar FreeScout';
    root.innerHTML = `<div class="panel state">${esc(data.error)}${data.detail ? `<br><code>${esc(data.detail)}</code>` : ''}<br><br><button class="refresh-btn" onclick="load(true)">Reintentar</button></div>`;
    return;
  }

  // The server may clamp the range (future dates, > 92 days)
  if (data.rango && (data.rango.desde !== range.desde || data.rango.hasta !== range.hasta)) {
    range = { desde: data.rango.desde, hasta: data.rango.hasta };
    history.replaceState(null, '', `?desde=${range.desde}&hasta=${range.hasta}`);
    syncRangeUi();
  }

  const n = data.ahora, p = data.periodo, a = data.periodo_anterior;
  const at = new Date(data.fetchedAt).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
  sub.innerHTML = `Buzón ${esc(data.buzon)} · ${data.agentes.length} agentes · Actualizado ${esc(at)}${data.stale ? ' · <span class="stale">datos en caché, FreeScout no respondió</span>' : ''}`;

  const rangeTxt = `${fmtDay(data.rango.desde)} – ${fmtDay(data.rango.hasta)}`;
  const prevTxt = `${fmtDay(data.rango_anterior.desde)} – ${fmtDay(data.rango_anterior.hasta)}`;

  const nowKpis = [
    { label: 'Abiertos', val: fmtNum(n.abiertos), sub: `${n.activos} activos · ${n.pendientes} pendientes`, rail: 'var(--accent)' },
    { label: 'Sin responsable', val: fmtNum(n.sin_responsable), sub: 'En el buzón, sin asignar', rail: n.sin_responsable > 0 ? 'var(--red)' : 'var(--green)' },
    { label: 'Más antiguo', val: n.mas_antiguo_dias == null ? '—' : `${n.mas_antiguo_dias}<span class="u">d</span>`, sub: 'Días abierto', rail: 'var(--amber)' },
  ];

  const periodKpis = [
    { label: 'Cierre · mediana', val: bigDur(p.cierre_mediana_h), sub: 'De creado a cerrado', d: delta(p.cierre_mediana_h, a.cierre_mediana_h, { lowerIsBetter: true }), rail: 'var(--accent)' },
    { label: 'Cierre · promedio', val: bigDur(p.cierre_promedio_h), sub: 'Afectado por casos largos', d: delta(p.cierre_promedio_h, a.cierre_promedio_h, { lowerIsBetter: true }), rail: 'var(--text-muted)' },
    { label: 'Cierre · p90', val: bigDur(p.cierre_p90_h), sub: '9 de cada 10 cierran antes', d: delta(p.cierre_p90_h, a.cierre_p90_h, { lowerIsBetter: true }), rail: 'var(--amber)' },
    { label: 'Cerrados en ≤ 24 h', val: p.cerrados_24h_pct == null ? '—' : `${p.cerrados_24h_pct}<span class="u">%</span>`, sub: 'Del total cerrado', d: delta(p.cerrados_24h_pct, a.cerrados_24h_pct), rail: 'var(--green)' },
    { label: 'Nuevos', val: fmtNum(p.nuevos), sub: 'Creados en el rango', d: delta(p.nuevos, a.nuevos, { neutral: true }), rail: 'var(--text-dim)' },
    { label: 'Cerrados', val: fmtNum(p.cerrados), sub: 'Por los 5 agentes', d: delta(p.cerrados, a.cerrados), rail: 'var(--green)' },
  ];

  const agents = data.por_agente;
  const frtMax = Math.max(1, ...agents.map(g => g.primera_respuesta_mediana_min || 0));
  const closeMax = Math.max(1, ...agents.map(g => g.cierre_mediana_h || 0));
  const bar = (v, max, color, txt) => `<div class="tbar">
      <div class="tbar-track"><div class="tbar-fill" style="width:${v == null ? 0 : Math.max(2, (v / max) * 100)}%;background:${color}"></div></div>
      <span class="tbar-val${v == null ? ' na' : ''}">${txt}</span></div>`;

  const ages = n.antiguedad || [];
  const ageMax = Math.max(1, ...ages.map(b => b.count));
  const ramp = ['var(--green)', 'var(--accent)', 'var(--amber)', 'color-mix(in srgb, var(--amber) 45%, var(--red))', 'var(--red)'];
  const old = ages.slice(-2).reduce((s, b) => s + b.count, 0);
  const num = v => `<td class="num${!v ? ' zero' : ''}">${v == null ? '—' : fmtNum(v)}</td>`;
  const kpiHtml = k => `<div class="kpi" style="--rail:${k.rail}">
      <div class="eyebrow">${k.label}</div>
      <div class="kpi-val">${k.val}</div>
      <div class="kpi-sub">${esc(k.sub)}</div>${k.d || ''}
    </div>`;

  root.innerHTML = `
    <div class="section-title">Ahora <small>Tickets abiertos del buzón (agentes del equipo + sin asignar)</small></div>
    <div class="kpis">${nowKpis.map(kpiHtml).join('')}</div>

    <div class="section-title">Periodo <small>${esc(rangeTxt)} · ${data.rango.dias} días · comparado con ${esc(prevTxt)}</small></div>
    <div class="kpis">${periodKpis.map(kpiHtml).join('')}</div>

    <div class="grid2">
      <div class="panel">
        <div class="panel-head"><div class="eyebrow">Tiempos por agente · medianas</div><button class="refresh-btn" onclick="load(true)">Actualizar</button></div>
        <div class="tbars">
          <div class="h hname">Agente</div>
          <div class="h"><i style="background:var(--accent)"></i>1ª respuesta</div>
          <div class="h"><i style="background:var(--amber)"></i>Cierre</div>
          ${agents.map(g => `
            <div class="who">${avatar(g.name)}<span class="who-name">${esc(g.name)}</span></div>
            ${bar(g.primera_respuesta_mediana_min, frtMax, 'var(--accent)', fmtMin(g.primera_respuesta_mediana_min))}
            ${bar(g.cierre_mediana_h, closeMax, 'var(--amber)', fmtHours(g.cierre_mediana_h))}
          `).join('')}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><div class="eyebrow">Antigüedad de abiertos</div><span class="hint">${fmtNum(n.abiertos)} tickets</span></div>
        ${ages.map((b, i) => `<div class="age-row">
          <div class="age-label">${esc(b.label)}</div>
          <div class="age-track"><div class="age-fill" style="width:${(b.count / ageMax) * 100}%;background:${ramp[Math.min(i, ramp.length - 1)]}"></div></div>
          <div class="age-count">${b.count}</div>
        </div>`).join('')}
        <div class="age-foot">${n.abiertos ? `${Math.round((old / n.abiertos) * 100)}% lleva más de 7 días abierto.` : ''}</div>
      </div>
    </div>

    <div id="calidad" style="display:flex;flex-direction:column;gap:1rem;"><div class="panel state">Cargando satisfacción y metas…</div></div>

    ${trendHtml(data.tendencia)}

    <div class="panel">
      <div class="panel-head"><div class="eyebrow">Por agente · ${esc(rangeTxt)}</div></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Agente</th><th class="num">Abiertos ahora</th><th class="num">Cerrados</th><th class="num">Respuestas</th><th class="num">1ª resp. mediana</th><th class="num">Cierre mediana</th><th class="num">Cierre promedio</th></tr></thead>
        <tbody>${agents.map(g => `<tr>
          <td><span class="who">${avatar(g.name)}${esc(g.name)}</span></td>
          ${num(g.abiertos)}${num(g.cerrados)}${num(g.respuestas)}
          <td class="num">${fmtMin(g.primera_respuesta_mediana_min)}</td>
          <td class="num">${fmtHours(g.cierre_mediana_h)}</td>
          <td class="num">${fmtHours(g.cierre_promedio_h)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>

    <div class="notes">
      Tiempos en horas calendario (no laborales). El tiempo de cierre va de la creación del ticket a su cierre y se calcula solo con tickets del buzón ${esc(data.buzon)} cerrados por estos agentes.
      La 1ª respuesta es la mediana que calcula FreeScout por agente${data.primera_respuesta_disponible ? '' : ' <span class="warn">(no disponible en este momento)</span>'}.
      ${data.lista_parcial ? `<br><span class="warn">FreeScout devolvió ${fmtNum(data.tickets_leidos)} tickets y hay más; rangos muy antiguos pueden estar incompletos.</span>` : ''}
    </div>`;
}

// ── Tooltip (shared by every [data-tip] element; content is pre-escaped HTML) ──
const tipEl = document.createElement('div'); tipEl.id = 'tip'; document.body.appendChild(tipEl);
document.addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tipEl.style.opacity = 0; return; }
  tipEl.innerHTML = t.getAttribute('data-tip');
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px'; tipEl.style.opacity = 1;
});
const attr = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const tipRows = (title, rows) => attr(`<b>${esc(title)}</b>` + rows.map(([k, v]) => `<div class="row"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join(''));
const fmtLabH = h => h == null ? '—' : `${Number(h).toFixed(1).replace('.0', '')} h`;
const pct = (num, den) => den ? Math.round((num / den) * 100) : null;
function compliancePill(p) {
  if (p == null) return '<span class="pill">sin datos</span>';
  const cls = p >= 90 ? 'good' : p >= 70 ? 'warn' : 'bad';
  return `<span class="pill ${cls}">${p}% en meta</span>`;
}
function weekLabel(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('es-CO', { day: 'numeric', month: 'short' });
}

// ── Satisfaction + business-hours goals ──
function renderCalidad(q) {
  const box = document.getElementById('calidad');
  if (!box) return;
  if (!q || !q.configured || q.error) {
    box.innerHTML = `<div class="panel state">${esc(q && q.error || 'No se pudo cargar satisfacción y metas.')}${q && q.detail ? `<br><code>${esc(q.detail)}</code>` : ''}</div>`;
    return;
  }
  const e = q.equipo, c = e.calificaciones;
  const totalCal = c.excelente + c.regular + c.mala;
  const csat = pct(c.excelente, totalCal);
  const cov = q.cobertura.desde < q.rango.desde
    ? `Reporte por semanas completas: ${fmtDay(q.cobertura.desde)} – ${fmtDay(q.cobertura.hasta)}`
    : `${fmtDay(q.cobertura.desde)} – ${fmtDay(q.cobertura.hasta)}`;
  const metaPrimera = q.metas ? `${q.metas.primera_respuesta} h` : '—';
  const metaSig = q.metas ? `${q.metas.respuestas_siguientes} h` : '—';
  const j = q.jornada;
  const jornadaTxt = j ? `L–V ${String(Math.floor(j.inicio)).padStart(2, '0')}:00–${String(Math.floor(j.fin)).padStart(2, '0')}:00` : '';
  const kpi = k => `<div class="kpi" style="--rail:${k.rail}">
      <div class="eyebrow">${k.label}</div><div class="kpi-val">${k.val}</div><div class="kpi-sub">${esc(k.sub)}</div></div>`;

  const satKpis = [
    { label: 'Satisfacción', val: csat == null ? '—' : `${csat}<span class="u">%</span>`, sub: 'Calificaciones "excelente"', rail: 'var(--green)' },
    { label: 'Calificaciones', val: fmtNum(totalCal), sub: `${c.excelente} excelente · ${c.regular} regular · ${c.mala} mala`, rail: 'var(--text-dim)' },
    { label: 'Tasa de respuesta', val: e.cerrados ? `${pct(totalCal, e.cerrados)}<span class="u">%</span>` : '—', sub: `Calificaciones / ${fmtNum(e.cerrados)} cerrados`, rail: 'var(--accent)' },
    { label: 'Malas', val: fmtNum(c.mala), sub: 'Revisar cada caso', rail: c.mala ? 'var(--red)' : 'var(--green)' },
  ];
  const p1 = pct(e.primera.cantidad - e.primera.fuera_de_meta, e.primera.cantidad);
  const p2 = pct(e.siguientes.cantidad - e.siguientes.fuera_de_meta, e.siguientes.cantidad);
  const goalKpis = [
    { label: '1ª respuesta en meta', val: p1 == null ? '—' : `${p1}<span class="u">%</span>`, sub: `${e.primera.cantidad - e.primera.fuera_de_meta} de ${e.primera.cantidad} en ≤ ${metaPrimera}`, rail: p1 == null ? 'var(--text-dim)' : p1 >= 90 ? 'var(--green)' : p1 >= 70 ? 'var(--amber)' : 'var(--red)' },
    { label: 'Siguientes en meta', val: p2 == null ? '—' : `${p2}<span class="u">%</span>`, sub: `${e.siguientes.cantidad - e.siguientes.fuera_de_meta} de ${e.siguientes.cantidad} en ≤ ${metaSig}`, rail: p2 == null ? 'var(--text-dim)' : p2 >= 90 ? 'var(--green)' : p2 >= 70 ? 'var(--amber)' : 'var(--red)' },
    { label: 'Sin contestar', val: fmtNum(q.alarmas.sin_contestar.length), sub: 'El usuario escribió y nadie respondió', rail: q.alarmas.sin_contestar.length ? 'var(--red)' : 'var(--green)' },
    { label: 'Cerrados sin respuesta', val: fmtNum(e.cerrados_sin_respuesta), sub: 'Cerrados sin escribir al usuario', rail: e.cerrados_sin_respuesta ? 'var(--amber)' : 'var(--green)' },
  ];

  const statusCol = { excelente: 'var(--green)', regular: 'var(--amber)', mala: 'var(--red)' };
  const csatRows = q.agentes.map(a => {
    const k = a.calificaciones, t = k.excelente + k.regular + k.mala;
    const seg = key => k[key] ? `<span style="width:${(k[key] / t) * 100}%;background:${statusCol[key]}"
        data-tip="${tipRows(a.name, [[key[0].toUpperCase() + key.slice(1), String(k[key])], ['Total', String(t)]])}"></span>` : '';
    return `<div class="csat-row">
      <div class="who">${avatar(a.name)}<span class="who-name">${esc(a.name)}</span></div>
      ${t ? `<div class="stack">${seg('excelente')}${seg('regular')}${seg('mala')}</div>` : '<div class="stack-empty">Sin calificaciones</div>'}
      <div class="csat-val">${t ? `${pct(k.excelente, t)}%` : '—'}</div>
    </div>`;
  }).join('');

  const malaItem = m => `<li><span class="n">#${esc(m.numero ?? m.ticket ?? '')}</span>
      <span class="s">${esc(m.asunto || m.subject || '')}<small>${esc(m.agente)}${m.comentario || m.comment ? ' · “' + esc(m.comentario || m.comment) + '”' : ''}</small></span>
      <span class="w">${esc((m.fecha || m.date || '').slice(0, 10))}</span></li>`;
  const alarmItem = t => `<li><span class="n">#${esc(t.numero)}</span>
      <span class="s">${esc(t.asunto)}<small>${esc(t.agente)}${t.estado ? ' · ' + esc(t.estado) : ''}</small></span>
      <span class="w">${fmtLabH(t.espera_horas_laborales)}</span></li>`;
  const worstItem = t => `<li><span class="n">#${esc(t.numero)}</span>
      <span class="s">${esc(t.asunto)}<small>${esc(t.agente)} · respondido ${esc(t.respondido || '')}</small></span>
      <span class="w">${fmtLabH(t.horas_laborales)}</span></li>`;
  const list = (items, fn, empty) => items.length ? `<ul class="alist">${items.map(fn).join('')}</ul>` : `<div class="empty-note">${empty}</div>`;

  box.innerHTML = `
    <div class="section-title">Satisfacción <small>${esc(cov)}${q.modulo_calificaciones ? '' : ' · módulo de calificaciones no activo'}</small></div>
    <div class="kpis">${satKpis.map(kpi).join('')}</div>
    <div class="grid2">
      <div class="panel">
        <div class="panel-head"><div class="eyebrow">Calificaciones por agente</div>
          <div class="legend"><span><i style="background:var(--green)"></i>Excelente</span><span><i style="background:var(--amber)"></i>Regular</span><span><i style="background:var(--red)"></i>Mala</span></div></div>
        ${csatRows}
      </div>
      <div class="panel">
        <div class="panel-head"><div class="eyebrow">Calificaciones malas</div><span class="hint">${fmtNum(q.malas.length)}</span></div>
        ${list(q.malas, malaItem, 'Ninguna calificación mala en el periodo.')}
      </div>
    </div>

    <div class="section-title">Metas en horas laborales <small>1ª respuesta ≤ ${esc(metaPrimera)} · siguientes ≤ ${esc(metaSig)}${jornadaTxt ? ' · ' + esc(jornadaTxt) : ''}</small></div>
    <div class="kpis">${goalKpis.map(kpi).join('')}</div>
    <div style="display:flex;flex-direction:column;gap:1rem;">
      <div class="panel">
        <div class="panel-head"><div class="eyebrow">Cumplimiento por agente</div></div>
        <div class="tbl-wrap"><table>
          <thead><tr><th>Agente</th><th class="num">1ª respuesta</th><th class="num">Siguientes</th><th class="num">Cerr. sin resp.</th><th class="num">Al vuelo</th></tr></thead>
          <tbody>${q.agentes.map(a => {
            const ap1 = pct(a.primera.cantidad - a.primera.fuera_de_meta, a.primera.cantidad);
            const ap2 = pct(a.siguientes.cantidad - a.siguientes.fuera_de_meta, a.siguientes.cantidad);
            return `<tr>
              <td><span class="who">${avatar(a.name)}${esc(a.name)}</span></td>
              <td class="num">${a.primera.cantidad ? `${a.primera.cantidad} · ${compliancePill(ap1)}` : '<span style="color:var(--text-dim)">—</span>'}</td>
              <td class="num">${a.siguientes.cantidad ? `${a.siguientes.cantidad} · ${compliancePill(ap2)}` : '<span style="color:var(--text-dim)">—</span>'}</td>
              <td class="num${!a.cerrados_sin_respuesta ? ' zero' : ''}">${a.cerrados_sin_respuesta}</td>
              <td class="num${!a.al_vuelo ? ' zero' : ''}">${a.al_vuelo}</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>
      </div>
      <div class="panel">
        <div class="panel-head"><div class="eyebrow">Alarmas</div><span class="hint">Tiempos en horas laborales</span></div>
        <div class="alist-title">Sin contestar (el usuario escribió y nadie respondió)</div>
        ${list(q.alarmas.sin_contestar, alarmItem, 'Ninguno.')}
        <div class="alist-title">Sin primera respuesta</div>
        ${list(q.alarmas.sin_primera_respuesta, alarmItem, 'Ninguno.')}
        <div class="alist-title">Primeras respuestas más lentas del periodo</div>
        ${list(q.peores_primera, worstItem, 'Sin datos.')}

}

// ── 12-week trend (grouped bars + backlog line, two charts: never a dual axis) and arrival heatmap ──
function niceMax(v) { if (v <= 5) return 5; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function roundTopBar(x, y, w, h, r) {
  if (h <= 0) return '';
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function trendHtml(tr) {
  if (!tr || !tr.semanas) return '';
  const W = 720, H = 210, L = 34, R = 8, T = 10, B = 26;
  const weeks = tr.semanas, n = weeks.length;
  const max = niceMax(Math.max(1, ...weeks.flatMap(w => [w.nuevos, w.cerrados])));
  const y = v => T + (H - T - B) * (1 - v / max);
  const band = (W - L - R) / n, bw = Math.min(16, (band - 10) / 2);
  const ticks = [0, max / 2, max];
  let bars = ticks.map(t => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${t}</text>`).join('');
  weeks.forEach((w, i) => {
    const cx = L + band * i + band / 2;
    bars += `<path d="${roundTopBar(cx - bw - 1, y(w.nuevos), bw, y(0) - y(w.nuevos), 4)}" fill="var(--c-new)"${w.parcial ? ' opacity="0.55"' : ''}/>`;
    bars += `<path d="${roundTopBar(cx + 1, y(w.cerrados), bw, y(0) - y(w.cerrados), 4)}" fill="var(--c-closed)"${w.parcial ? ' opacity="0.55"' : ''}/>`;
    if (i % (n > 8 ? 2 : 1) === 0 || i === n - 1) bars += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(weekLabel(w.semana))}</text>`;
    bars += `<rect class="hit" x="${L + band * i}" y="${T}" width="${band}" height="${H - T - B}" data-tip="${tipRows(`Semana del ${weekLabel(w.semana)}${w.parcial ? ' (en curso)' : ''}`, [
      ['Nuevos', String(w.nuevos)], ['Cerrados', String(w.cerrados)], ['Cierre mediana', fmtHours(w.cierre_mediana_h)], ['Abiertos al final', String(w.backlog)]])}"/>`;
  });

  const H2 = 130, B2 = 22;
  const bmax = niceMax(Math.max(1, ...weeks.map(w => w.backlog)));
  const y2 = v => T + (H2 - T - B2) * (1 - v / bmax);
  const xs = i => L + band * i + band / 2;
  let line = [0, bmax].map(t => `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y2(t)}" y2="${y2(t)}"/><text x="${L - 6}" y="${y2(t) + 3}" text-anchor="end">${t}</text>`).join('');
  line += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" points="${weeks.map((w, i) => `${xs(i)},${y2(w.backlog)}`).join(' ')}"/>`;
  const last = weeks[n - 1];
  line += `<circle cx="${xs(n - 1)}" cy="${y2(last.backlog)}" r="4" fill="var(--accent)" stroke="var(--bg-card)" stroke-width="2"/>`;
  line += `<text x="${xs(n - 1) - 8}" y="${y2(last.backlog) - 8}" text-anchor="end" style="fill:var(--text)">${last.backlog}</text>`;
  weeks.forEach((w, i) => {
    if (i % (n > 8 ? 2 : 1) === 0 || i === n - 1) line += `<text x="${xs(i)}" y="${H2 - 6}" text-anchor="middle">${esc(weekLabel(w.semana))}</text>`;
    line += `<rect class="hit" x="${L + band * i}" y="${T}" width="${band}" height="${H2 - T - B2}" data-tip="${tipRows(`Semana del ${weekLabel(w.semana)}`, [['Abiertos al final', String(w.backlog)]])}"/>`;
  });

  // Heatmap: weekdays × hours 5–21 (sequential: one hue, light → dark)
  const days = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
  const H0 = 5, H1 = 21;
  const hm = tr.mapa_calor;
  let outside = 0;
  hm.forEach(row => row.forEach((v, h) => { if (h < H0 || h > H1) outside += v; }));
  const hmax = Math.max(1, ...hm.flatMap(row => row.slice(H0, H1 + 1)));
  const cell = v => v ? `color-mix(in srgb, var(--c-new) ${Math.round(18 + (v / hmax) * 82)}%, var(--bg-card))` : 'var(--tint)';
  let heat = '<div></div>';
  for (let h = H0; h <= H1; h++) heat += `<div class="hh">${h}</div>`;
  days.forEach((d, di) => {
    heat += `<div class="hl">${d}</div>`;
    for (let h = H0; h <= H1; h++) {
      const v = hm[di][h];
      heat += `<div class="c" style="background:${cell(v)}" data-tip="${tipRows(`${d} ${h}:00–${h + 1}:00`, [['Tickets creados', String(v)]])}"></div>`;
    }
  });
  const totalWeeks = weeks.reduce((s, w) => s + w.nuevos, 0);

  return `
    <div class="section-title">Tendencia <small>Últimas 12 semanas · ${esc(fmtDay(tr.desde))} – ${esc(fmtDay(tr.hasta))}</small></div>
    <div class="panel">
      <div class="panel-head"><div class="eyebrow">Nuevos vs cerrados por semana</div>
        <div class="legend"><span><i style="background:var(--c-new)"></i>Nuevos · ${last.nuevos} esta semana</span><span><i style="background:var(--c-closed)"></i>Cerrados · ${last.cerrados}</span></div></div>
      <div class="chart-scroll"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tickets nuevos y cerrados por semana">${bars}</svg></div>
    </div>
    <div class="grid2 trend2">
      <div class="panel">
        <div class="panel-head"><div class="eyebrow">Abiertos al final de cada semana</div></div>
        <div class="chart-scroll"><svg viewBox="0 0 ${W} ${H2}" role="img" aria-label="Tickets abiertos al final de cada semana">${line}</svg></div>
      </div>
      <div class="panel">
        <div class="panel-head"><div class="eyebrow">¿Cuándo llegan los tickets?</div><span class="hint">${fmtNum(totalWeeks)} tickets</span></div>
        <div class="chart-scroll"><div class="heat" style="grid-template-columns: 34px repeat(${H1 - H0 + 1}, 1fr)">${heat}</div></div>
        <div class="heat-legend">Menos ${[0, 0.25, 0.5, 0.75, 1].map(f => `<span class="c" style="background:${f ? `color-mix(in srgb, var(--c-new) ${Math.round(18 + f * 82)}%, var(--bg-card))` : 'var(--tint)'}"></span>`).join('')} Más${outside ? ` · ${outside} fuera de 5:00–22:00` : ''}</div>
      </div>
    </div>`;
}

async function loadCalidad(force = false) {
  try {
    const qs = new URLSearchParams({ desde: range.desde, hasta: range.hasta });
    if (force) qs.set('refresh', '1');
    const q = await fetch('/api/tickets/calidad?' + qs).then(r => r.json());
    renderCalidad(q);
  } catch {
    renderCalidad({ error: 'No se pudo cargar satisfacción y metas.' });
  }
}

async function load(force = false) {
  const root = document.getElementById('root');
  root.classList.add('loading');
  try {
    const qs = new URLSearchParams({ desde: range.desde, hasta: range.hasta });
    if (force) qs.set('refresh', '1');
    const res = await fetch('/api/tickets?' + qs);
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch {
      const snippet = raw.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 140);
      data = { configured: true, error: `Respuesta inválida del servidor (HTTP ${res.status}).`, detail: snippet };
    }
    render(data);
    if (data.configured && !data.error) loadCalidad(force);
  } catch {
    render({ configured: true, error: 'Sin conexión con el servidor del dashboard.' });
  }
}

async function loadLeaders() {
  try { leaders = await fetch('/api/leaders').then(r => r.json()); } catch {}
}

// ── Theme toggle ──
function themeIcon(t) {
  return t === 'light'
    ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>'
    : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
}
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('theme', t); } catch (e) {}
  const b = document.getElementById('btnTheme');
  if (b) b.innerHTML = themeIcon(t);
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  applyTheme(cur === 'light' ? 'dark' : 'light');
}
applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');

syncRangeUi();
loadLeaders().then(() => load());
setInterval(() => load(), 5 * 60 * 1000);
</script>
